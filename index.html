<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layer Up — 3D-печать в Киеве</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --text: #f2f3f5;
    --muted: #a6acb8;
    --accent: #5b8cff;
    --accent-text: #0f1115;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
  }

  h1 {
    font-size: clamp(2.2rem, 8vw, 3rem);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }

  .tagline {
    font-size: 1.1rem;
    color: var(--muted);
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .points {
    list-style: none;
    margin: 0 0 36px;
    padding: 0;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .points li {
    font-size: 1.05rem;
    line-height: 1.5;
    padding-left: 28px;
    position: relative;
  }

  .points li::before {
    content: "—";
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  .cta {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 999px;
    transition: opacity 0.2s ease;
  }

  .cta:active {
    opacity: 0.8;
  }

  footer {
    margin-top: 28px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  @media (max-width: 420px) {
    main {
      padding: 32px 20px;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>Layer Up</h1>
    <p class="tagline">Печатаем на FDM-принтере детали, подарки и прототипы по вашей модели или идее в Киеве.</p>

    <ul class="points">
      <li>От 1 штуки — без минимальных партий, как у фабрик</li>
      <li>Готово за 1–3 дня</li>
      <li>Бесплатно поможем с моделью, если готового файла пока нет</li>
    </ul>

    <a class="cta" href="https://t.me/layerup_kyiv">Оставить заявку</a>

    <footer>Киев · самовывоз или доставка по Украине</footer>
  </main>
</body>
</html>
